services:
  db:
    image: postgres:16-alpine
    ports:
      # Host 5434 -> container 5432 (onde o Postgres realmente escuta).
      # 5432 direto bate com o Postgres nativo do sistema (systemd
      # `postgresql`, já ocupando 127.0.0.1:5432) — por isso o mapeamento
      # pro host é 5434, não 5432:5432. 5434 é o mesmo número que o
      # container manual `forms-meta-pg` usa (ver seção "Deploy" no
      # CLAUDE.md), mas não tem conflito real: só um dos dois estará de pé
      # por vez na prática (ou o `docker compose up`, ou o container
      # manual avulso) — exposto só pra inspecionar com um cliente externo
      # (pgAdmin), o app sempre fala com o serviço pelo nome `db`.
      - "5434:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forms_meta
    volumes:
      - forms-meta-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/forms_meta
      DJANGO_SECRET_KEY: dev-secret-troque-isto
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      target: build
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  forms-meta-dev-db:
