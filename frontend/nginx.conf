server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA (React Router): qualquer rota que não seja um arquivo real cai
    # no index.html, e o React Router assume dali — sem isso, acessar
    # /ferramentas ou /meu-porque direto na URL (ou dar F5 numa dessas
    # páginas) vira 404, já que o Nginx tentaria achar um arquivo com
    # esse nome, que não existe.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos dentro de /assets/ já vêm com hash no nome (Vite gera
    # assim a cada build) — podem ter cache agressivo no navegador, já
    # que o nome muda sempre que o conteúdo muda, nunca serve versão
    # velha por engano.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html é o único arquivo que pode mudar sem o nome mudar (ele
    # é quem referencia os assets com hash) — nunca cacheia ele, senão o
    # navegador pode continuar pedindo os assets antigos depois de um
    # deploy novo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
