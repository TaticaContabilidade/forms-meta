services:
  - type: web
    name: forms-meta
    env: node
    region: ohio
    plan: starter
    # --omit=dev: em produção não precisa de jsdom/supertest/autocannon
    # (só usados por npm test / npm run load-test) — instala mais rápido e
    # deixa menos coisa no servidor real.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      # Postgres gerenciado (ver bloco `databases` abaixo) — o Render injeta
      # a connection string automaticamente aqui, sem precisar copiar/colar
      # nada manualmente nem gerenciar esse segredo por fora do Blueprint.
      - key: DATABASE_URL
        fromDatabase:
          name: forms-meta-db
          property: connectionString

databases:
  # ATENÇÃO: isto provisiona um banco Postgres gerenciado de verdade,
  # cobrado à parte do serviço web, na 1ª vez que este Blueprint for
  # aplicado/deployado. Confirme o nome do plano e a região no dashboard do
  # Render antes de aplicar em produção — nomes de plano mudam com alguma
  # frequência, o valor abaixo é o menor plano pago no momento em que isto
  # foi escrito, não uma garantia de preço atual.
  - name: forms-meta-db
    plan: basic-256mb
    region: ohio
