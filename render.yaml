services:
  - type: web
    name: forms-meta
    env: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_TOKEN
        sync: false
    # Plano free não suporta Persistent Disk: o SQLite em db/metas.db
    # é apagado a cada deploy e quando a instância dorme por inatividade.
